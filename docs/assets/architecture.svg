<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .title { font-size: 22px; font-weight: 600; fill: #1e1e1e; }
      .frame-label { font-size: 12px; fill: #495057; }
      .box-label { font-size: 13px; fill: #1e1e1e; text-anchor: middle; }
      .box-sublabel { font-size: 11px; fill: #495057; text-anchor: middle; }
      .small-label { font-size: 11px; fill: #495057; }
    </style>
  </defs>

  <!-- Title -->
  <text x="410" y="30" class="title" text-anchor="middle">terraform-aws-rds</text>

  <!-- VPC Frame -->
  <rect x="40" y="50" width="520" height="420" rx="8" fill="#ebfbee" stroke="#2b8a3e"
        stroke-width="2" stroke-dasharray="8,4"/>
  <text x="55" y="72" class="frame-label">VPC</text>

  <!-- DB Subnet Group -->
  <rect x="60" y="90" width="480" height="200" rx="6" fill="#fff9db" stroke="#e67700"
        stroke-width="1" stroke-dasharray="5,3"/>
  <text x="75" y="110" class="frame-label">DB Subnet Group</text>

  <!-- Subnet AZ-a -->
  <rect x="80" y="120" width="220" height="155" rx="4" fill="#d3f9d8" stroke="#37b24d"
        stroke-width="1"/>
  <text x="95" y="140" class="frame-label">Private Subnet (AZ-a)</text>

  <!-- RDS Primary -->
  <rect x="110" y="155" width="160" height="100" rx="10" fill="#d0ebff" stroke="#1971c2"
        stroke-width="2"/>
  <text x="190" y="195" class="box-label">RDS MySQL</text>
  <text x="190" y="215" class="box-label">Primary</text>
  <text x="190" y="240" class="box-sublabel">db.t4g.medium</text>

  <!-- Subnet AZ-b -->
  <rect x="320" y="120" width="200" height="155" rx="4" fill="#d3f9d8" stroke="#37b24d"
        stroke-width="1"/>
  <text x="335" y="140" class="frame-label">Private Subnet (AZ-b)</text>

  <!-- RDS Standby -->
  <rect x="340" y="155" width="160" height="100" rx="10" fill="#e9ecef" stroke="#868e96"
        stroke-width="2"/>
  <text x="420" y="195" class="box-label">RDS MySQL</text>
  <text x="420" y="215" class="box-label">Standby</text>
  <text x="420" y="240" class="box-sublabel">(Multi-AZ)</text>

  <!-- Replication arrow -->
  <line x1="270" y1="205" x2="340" y2="205" stroke="#868e96" stroke-width="1.5"
        stroke-dasharray="4,3" marker-end="url(#arrowhead-gray)"/>

  <!-- Security Group -->
  <rect x="60" y="310" width="480" height="45" rx="6" fill="#ffe3e3" stroke="#c92a2a"
        stroke-width="1"/>
  <text x="300" y="337" class="box-label">Security Group — Ingress: VPC CIDR → port 3306</text>

  <!-- Parameter Group -->
  <rect x="60" y="375" width="230" height="40" rx="6" fill="#fff4e6" stroke="#e8590c"
        stroke-width="1"/>
  <text x="175" y="400" class="box-label">Parameter Group (mysql8.x)</text>

  <!-- KMS -->
  <rect x="310" y="375" width="230" height="40" rx="6" fill="#ffe3e3" stroke="#c92a2a"
        stroke-width="1"/>
  <text x="425" y="400" class="box-label">KMS (encryption at rest)</text>

  <!-- Performance Insights -->
  <rect x="60" y="430" width="480" height="35" rx="6" fill="#e5dbff" stroke="#7048e8"
        stroke-width="1"/>
  <text x="300" y="452" class="box-label">Performance Insights (always enabled, 7-day free tier)</text>

  <!-- ── External Services (right column) ── -->

  <!-- Secrets Manager -->
  <rect x="610" y="70" width="180" height="60" rx="8" fill="#ffe3e3" stroke="#c92a2a"
        stroke-width="2"/>
  <text x="700" y="97" class="box-label">Secrets Manager</text>
  <text x="700" y="115" class="box-sublabel">(master password)</text>

  <!-- Arrow RDS -> Secrets -->
  <path d="M 270 175 Q 400 60 610 100" fill="none" stroke="#868e96" stroke-width="1.5"
        stroke-dasharray="4,3" marker-end="url(#arrowhead-gray)"/>

  <!-- CloudWatch -->
  <rect x="610" y="160" width="180" height="60" rx="8" fill="#e5dbff" stroke="#7048e8"
        stroke-width="2"/>
  <text x="700" y="185" class="box-label">CloudWatch</text>
  <text x="700" y="203" class="box-sublabel">7 alarms + dashboard</text>

  <!-- Arrow RDS -> CloudWatch -->
  <path d="M 500 205 L 610 190" fill="none" stroke="#495057" stroke-width="1.5"
        marker-end="url(#arrowhead)"/>

  <!-- SNS Topic -->
  <rect x="610" y="260" width="180" height="60" rx="8" fill="#fff4e6" stroke="#e8590c"
        stroke-width="2"/>
  <text x="700" y="287" class="box-label">SNS Topic</text>
  <text x="700" y="305" class="box-sublabel">(alarm notifications)</text>

  <!-- Arrow CW -> SNS -->
  <line x1="700" y1="220" x2="700" y2="260" stroke="#495057" stroke-width="1.5"
        marker-end="url(#arrowhead)"/>

  <!-- Email -->
  <rect x="610" y="360" width="180" height="50" rx="8" fill="#e9ecef" stroke="#495057"
        stroke-width="1"/>
  <text x="700" y="383" class="box-label">Email Subscriptions</text>
  <text x="700" y="399" class="box-sublabel">(alarm_emails)</text>

  <!-- Arrow SNS -> Email -->
  <line x1="700" y1="320" x2="700" y2="360" stroke="#495057" stroke-width="1.5"
        marker-end="url(#arrowhead)"/>

  <!-- Secret Policy -->
  <rect x="610" y="440" width="180" height="40" rx="6" fill="#ffe3e3" stroke="#c92a2a"
        stroke-width="1"/>
  <text x="700" y="465" class="box-label">Secret Policy (IAM readers)</text>

  <!-- Arrow Secrets -> Policy -->
  <line x1="700" y1="130" x2="700" y2="440" stroke="#c92a2a" stroke-width="1"
        stroke-dasharray="3,4" opacity="0.4"/>

  <!-- Application (top-right) -->
  <ellipse cx="700" cy="35" rx="70" ry="22" fill="#e9ecef" stroke="#495057" stroke-width="1.5"/>
  <text x="700" y="40" class="box-label">Application</text>

  <!-- Arrow App -> RDS -->
  <path d="M 630 40 Q 400 40 190 155" fill="none" stroke="#1971c2" stroke-width="2"
        marker-end="url(#arrowhead-blue)"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#868e96"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1971c2"/>
    </marker>
  </defs>
</svg>
